services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: menuju
      MYSQL_ROOT_PASSWORD: local
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    volumes:
      - menuju_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  menuju_mysql:
