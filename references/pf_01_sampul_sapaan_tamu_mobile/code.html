<!DOCTYPE html>

<html class="h-full" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>The Wedding of Dimas &amp; Nadia</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cormorant: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
          colors: {
            champagne: '#F9F6F0',
            sandstone: '#E8E1D5',
            botanical: {
              800: '#1F2922',
              900: '#141D17',
            },
            gold: {
              300: '#E6C994',
              400: '#D4AF37',
              500: '#C59B27',
            }
          },
          animation: {
            'subtle-pulse': 'subtlePulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float-slow': 'floatSlow 6s ease-in-out infinite',
          },
          keyframes: {
            subtlePulse: {
              '0%, 100%': { transform: 'scale(1)', opacity: '1', boxShadow: '0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 15px rgba(212, 175, 55, 0.25)' },
              '50%': { transform: 'scale(1.02)', opacity: '0.98', boxShadow: '0 15px 30px -5px rgba(0, 0, 0, 0.5), 0 0 25px rgba(212, 175, 55, 0.45)' },
            },
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-4px)' }
            }
          }
        }
      }
    }
  </script>
<!-- Google Fonts for Editorial Luxury -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    .font-editorial {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .letter-spacing-wide {
      letter-spacing: 0.22em;
    }
    .letter-spacing-widest {
      letter-spacing: 0.32em;
    }
  </style>
<style data-purpose="glassmorphism-effects">
    /* Subtle glass card style for salutation pill */
    .glass-salutation {
      background: rgba(22, 28, 23, 0.52);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    /* Top sound toggle glass */
    .glass-pill {
      background: rgba(18, 24, 19, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    
    /* Safe-area insets for mobile iOS notch and home indicator */
    .pb-safe {
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
    .pt-safe {
      padding-top: max(1rem, env(safe-area-inset-top));
    }
  </style>
</head>
<body class="h-full bg-botanical-900 text-stone-100 antialiased font-sans flex items-center justify-center m-0 p-0 overflow-x-hidden select-none">
<!-- BEGIN: MobileDeviceCanvasWrapper -->
<!-- Container locked to mobile dimensions (max 390px-430px width typical for modern iPhone screens) -->
<main class="relative w-full max-w-[414px] h-[100dvh] overflow-hidden flex flex-col justify-between shadow-2xl bg-botanical-900" data-purpose="invitation-screen">
<!-- BEGIN: HeroBackgroundLayer -->
<!-- Full-bleed background hero portrait of Dimas & Nadia -->
<div class="absolute inset-0 z-0 overflow-hidden" data-purpose="hero-image-container">
<img alt="Atmospheric Indonesian wedding portrait of bride and groom in modern warm botanical setting, Dimas and Nadia" class="w-full h-full object-cover object-center filter brightness-[0.93] contrast-[1.03] scale-[1.01]" id="bg-hero-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDf_rAJ5512yjS3LCXVeR7FP--ujkK-ZmdifT1RABhRhMGCQk3E_ZFjdiWFEFhHbny6oOvhbt5xvCP7stIZ2htjbO7HwmIiA3_Yq1eUz8g3r5915SoAva0AUyQTt_DFDkCBrBUb1S0N6kDGYwSBUp-jupN2lmNh--olBTHSf85fZyWtgbUoSQYHxCQWLCPSQD3nf2I-sZAPYhcNFVbk_vYOJuCIWA63intUpPfWvyc"/>
<!-- Cinematic Gradient Scrim: Top subtle vignette for status & audio pill -->
<div aria-hidden="true" class="absolute inset-x-0 top-0 h-44 bg-gradient-to-b from-black/85 via-black/45 to-transparent pointer-events-none"></div>
<!-- Cinematic Gradient Scrim: Bottom dark editorial gradient ensuring high legibility for texts & CTA -->
<div aria-hidden="true" class="absolute inset-x-0 bottom-0 h-[64%] bg-gradient-to-t from-stone-950/95 via-stone-950/70 to-transparent pointer-events-none"></div>
<!-- Atmospheric warm tint layer for cohesion -->
<div aria-hidden="true" class="absolute inset-0 bg-[#2d2216]/15 mix-blend-multiply pointer-events-none"></div>
</div>
<!-- END: HeroBackgroundLayer -->
<!-- BEGIN: TopBarArea -->
<!-- Sound indicator pill and top hierarchy elements -->
<header class="relative z-10 w-full pt-safe px-5 pt-4 flex flex-col items-center" data-purpose="top-navigation-area">
<!-- Audio Status Pill (User Gesture Respective) -->
<button aria-label="Kontrol musik latar: Claude Debussy - Clair de Lune" class="glass-pill rounded-full px-3.5 py-1.5 flex items-center space-x-2 text-stone-200 text-[11px] tracking-wide shadow-md transition-all duration-300 hover:border-gold-300/50 active:scale-95" data-purpose="audio-indicator" id="audio-toggle-btn" type="button">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gold-400 opacity-60" id="audio-pulse"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-gold-400"></span>
</span>
<span class="truncate max-w-[210px] text-stone-300 font-light font-sans">
          Musik: <span class="text-stone-100 font-medium">Clair de Lune</span> · Debussy
        </span>
<!-- Note musical icon -->
<svg class="w-3.5 h-3.5 text-gold-300" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path>
</svg>
</button>
<!-- Delicate Botanical Badge: The Wedding Of -->
<div class="mt-4 flex flex-col items-center justify-center animate-float-slow" data-purpose="editorial-header-badge">
<div class="flex items-center space-x-2.5 opacity-90">
<span class="w-6 h-[1px] bg-gradient-to-r from-transparent via-gold-300/60 to-gold-300"></span>
<!-- Olive leaf / botanical emblem SVG -->
<svg class="w-4 h-4 text-gold-300" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
<path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
</svg>
<span class="w-6 h-[1px] bg-gradient-to-l from-transparent via-gold-300/60 to-gold-300"></span>
</div>
<p class="text-[10px] uppercase font-sans letter-spacing-widest text-gold-300/90 font-medium mt-1.5 drop-shadow">
          The Wedding Of
        </p>
</div>
</header>
<!-- END: TopBarArea -->
<!-- BEGIN: InvitationContentArea -->
<!-- Couple Names, Salutation Card, Details, and Open Invitation CTA -->
<section class="relative z-10 w-full px-5 pb-safe pb-6 flex flex-col items-center text-center mt-auto" data-purpose="invitation-content-and-cta">
<!-- Main Couple Headline -->
<div class="mb-4 w-full" data-purpose="couple-headline">
<h1 class="font-editorial text-4xl sm:text-[44px] font-normal leading-[1.08] tracking-wide text-champagne drop-shadow-lg">
<span class="block">Dimas</span>
<span class="text-2xl sm:text-3xl font-light italic font-editorial text-gold-300/90 -my-1 block">&amp;</span>
<span class="block">Nadia</span>
</h1>
<!-- Wedding Date & Location -->
<div class="mt-2.5 flex items-center justify-center space-x-2 text-stone-300 text-xs sm:text-[13px] tracking-wide">
<span class="font-light">Minggu, 14 Desember 2026</span>
<span class="text-gold-400/80 text-[10px]">•</span>
<span class="font-light">Bandung, Jawa Barat</span>
</div>
</div>
<!-- Salutation Glass Card / Pill -->
<div class="w-full max-w-[340px] glass-salutation rounded-2xl p-4 my-2 text-center relative overflow-hidden transition-all duration-300" data-purpose="guest-salutation-card">
<!-- Subtle Corner Ornamental Accents -->
<div class="absolute -top-6 -right-6 w-12 h-12 rounded-full bg-gold-400/10 blur-md pointer-events-none"></div>
<div class="absolute -bottom-6 -left-6 w-12 h-12 rounded-full bg-gold-400/10 blur-md pointer-events-none"></div>
<p class="text-[9.5px] uppercase letter-spacing-wide text-stone-400 font-medium">
          Kepada Yth. Bapak/Ibu/Saudara/i
        </p>
<!-- Recipient Name (Dynamic target from URL parameter) -->
<h2 class="font-editorial text-xl sm:text-[22px] font-semibold text-stone-100 tracking-wide mt-1 mb-0.5" id="guest-name">
          Keluarga Adhitama
        </h2>
<p class="text-[11px] text-stone-400 italic font-editorial">
          di Tempat
        </p>
</div>
<!-- Primary Action CTA: Buka Undangan -->
<div class="w-full max-w-[340px] mt-3" data-purpose="cta-container">
<button class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-stone-100 via-[#FAF7F2] to-stone-200 text-stone-900 font-sans font-medium text-sm tracking-wider uppercase transition-all duration-300 hover:brightness-105 active:scale-[0.98] shadow-lg shadow-black/50 flex items-center justify-center space-x-2.5 animate-subtle-pulse group" data-purpose="open-invitation-action" id="btn-open-invitation" onclick="handleOpenInvitation()" type="button">
<!-- Wax Seal / Envelope Icon -->
<span class="w-6 h-6 rounded-full bg-botanical-800 text-gold-300 flex items-center justify-center flex-shrink-0 transition-transform duration-300 group-hover:scale-110">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>
<polyline points="3 8 12 14 21 8"></polyline>
<path d="M3 8l9-5 9 5"></path>
</svg>
</span>
<span class="font-semibold tracking-[0.14em] text-stone-900">Buka Undangan</span>
</button>
</div>
<!-- Audio & Best Experience Micro-caption -->
<footer class="mt-3.5 text-center" data-purpose="guest-instruction-footer">
<p class="text-[10px] text-stone-400/80 font-light tracking-wide flex items-center justify-center space-x-1">
<svg class="w-3 h-3 text-gold-300/70 inline" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span>*Mohon aktifkan mode suara untuk pengalaman terbaik</span>
</p>
</footer>
</section>
<!-- END: InvitationContentArea -->
</main>
<!-- END: MobileDeviceCanvasWrapper -->
<!-- BEGIN: ClientScript -->
<!-- URL Salutation Parameter Parser & Interactive Click Handler -->
<script data-purpose="guest-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Optional dynamically extracted guest name from URL parameter ?to=
      const urlParams = new URLSearchParams(window.location.search);
      const toParam = urlParams.get('to');
      if (toParam) {
        // Convert slug e.g. "keluarga-adhitama" into "Keluarga Adhitama"
        const formattedGuest = toParam
          .split(/[-_]+/)
          .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
          .join(' ');
        const guestNameEl = document.getElementById('guest-name');
        if (guestNameEl && formattedGuest.trim().length > 0) {
          guestNameEl.textContent = formattedGuest;
        }
      }

      // 2. Audio button status toggle simulation
      const audioBtn = document.getElementById('audio-toggle-btn');
      const audioPulse = document.getElementById('audio-pulse');
      let isPlaying = true;

      if (audioBtn) {
        audioBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          isPlaying = !isPlaying;
          if (isPlaying) {
            audioPulse.classList.remove('hidden');
          } else {
            audioPulse.classList.add('hidden');
          }
        });
      }
    });

    // 3. Action when guest taps 'Buka Undangan'
    function handleOpenInvitation() {
      const openBtn = document.getElementById('btn-open-invitation');
      if (openBtn) {
        openBtn.classList.remove('animate-subtle-pulse');
        openBtn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-stone-900 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span class="font-semibold tracking-[0.14em]">Membuka...</span>
        `;
      }

      // Smooth cinematic transition out or route trigger
      setTimeout(() => {
        // In full invitation application, this scrolls to the ceremony section or loads next view
        console.log("Navigating to full wedding itinerary...");
      }, 600);
    }
  </script>
<!-- END: ClientScript -->
</body></html>
